# Pile de production de Coaching Life sur le serveur, déployée par Dokploy (service de type Compose).
# Dokploy lit ce fichier dans le dépôt (branche master) à chaque déploiement et ne construit rien :
# il tire les images publiées sur GHCR par la CI.
#
# - Aucun port publié : le trafic arrive par le tunnel Cloudflare, puis le Traefik de Dokploy, qui
#   joint `coaching-life-app` par `dokploy-network`. Le domaine se règle dans l'onglet Domains de
#   Dokploy (service `coaching-life-app`, port 3000), qui ajoute les labels Traefik. Le même processus
#   sert le front et l'API (/api).
# - Base de données hors de la pile : un service Postgres de Dokploy (`POSTGRES_HOST`), joint par
#   `dokploy-network`. Redéployer ou supprimer la pile ne touche pas aux données.
# - Variables : onglet Environment de Dokploy, écrit dans le `.env` voisin (modèle :
#   `coaching-life.env.example`). Chaque service ne reçoit que les siennes.
# - Noms de service préfixés : `dokploy-network` est partagé avec les autres piles du serveur.
# - Migrations et seed idempotent : à chaque démarrage de l'application, avant d'écouter.
# - Retour à une version : fixer `APP_IMAGE` sur un tag `sha-<commit>` et redéployer.

name: coaching-life

services:
  coaching-life-app:
    image: ${APP_IMAGE:-ghcr.io/j-ned/coaching-life-app:latest}
    pull_policy: ${PULL_POLICY:-always}
    restart: unless-stopped
    environment:
      # Base hors de la pile : si elle ne répond pas encore, le démarrage échoue et Docker relance.
      - DATABASE_URL=postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@${POSTGRES_HOST:?}:5432/${POSTGRES_DB:?}
      - SESSION_SECRET=${SESSION_SECRET:?}
      - CORS_ORIGIN=${CORS_ORIGIN:?}
      # Derrière le tunnel Cloudflare, le dernier saut de X-Forwarded-For est le tunnel, le même pour
      # tous : l'adresse du visiteur est dans cet en-tête. Sûr tant qu'aucun port du serveur n'est
      # ouvert sur Internet.
      - CLIENT_IP_HEADER=${CLIENT_IP_HEADER:-cf-connecting-ip}
      - ADMIN_EMAIL=${ADMIN_EMAIL:?}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?}
      - S3_ENDPOINT=${S3_ENDPOINT:?}
      - S3_REGION=${S3_REGION:-auto}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:?}
      - S3_SECRET_KEY=${S3_SECRET_KEY:?}
      - S3_BUCKET=${S3_BUCKET:?}
      - SMTP_HOST=${SMTP_HOST:?}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:?}
      - SMTP_PASS=${SMTP_PASS:?}
      # Facultative : transmise seulement si elle est définie.
      - SMTP_FROM
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - dokploy-network

  # Sauvegarde quotidienne chiffrée de la base vers un bucket hors du serveur (`backup/backup.sh`).
  coaching-life-backup:
    image: ${BACKUP_IMAGE:-ghcr.io/j-ned/coaching-life-backup:latest}
    pull_policy: ${PULL_POLICY:-always}
    restart: unless-stopped
    environment:
      PGHOST: ${POSTGRES_HOST:?}
      PGUSER: ${POSTGRES_USER:?}
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      PGDATABASE: ${POSTGRES_DB:?}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:?}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:?}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:?}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:?}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:?}
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
