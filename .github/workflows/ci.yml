name: CI

on:
  push:
    branches: [master]
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test --watch=false
      - run: pnpm build
      - run: pnpm --filter @coaching-life/backend typecheck
      - run: pnpm --filter @coaching-life/backend test
      - run: pnpm --filter @coaching-life/backend build
      - run: pnpm --filter @coaching-life/backend build:vercel
      - run: pnpm --filter @coaching-life/backend check:vercel-function
      - run: pnpm audit --prod --audit-level high

  # Applique les migrations sur la branche Neon `preview` (jamais la prod). Ignoré si le secret
  # n'est pas configuré, ainsi que pour les PR de forks (GitHub ne leur transmet pas les secrets).
  preview-migrations:
    if: github.event_name == 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    concurrency:
      group: preview-migrations
      cancel-in-progress: false
    env:
      PREVIEW_DATABASE_URL_UNPOOLED: ${{ secrets.PREVIEW_DATABASE_URL_UNPOOLED }}
    steps:
      - name: Secret absent, migrations de preview ignorées
        if: env.PREVIEW_DATABASE_URL_UNPOOLED == ''
        run: echo "::notice::PREVIEW_DATABASE_URL_UNPOOLED absent, migrations de preview ignorées."
      - uses: actions/checkout@v4
        if: env.PREVIEW_DATABASE_URL_UNPOOLED != ''
      - uses: pnpm/action-setup@v4
        if: env.PREVIEW_DATABASE_URL_UNPOOLED != ''
      - uses: actions/setup-node@v4
        if: env.PREVIEW_DATABASE_URL_UNPOOLED != ''
        with:
          node-version: 26
          cache: pnpm
      - if: env.PREVIEW_DATABASE_URL_UNPOOLED != ''
        run: pnpm install --frozen-lockfile --filter @coaching-life/backend
      - name: Migrations sur la branche Neon preview
        if: env.PREVIEW_DATABASE_URL_UNPOOLED != ''
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL_UNPOOLED }}
        run: pnpm exec tsx src/db/migrate.ts

  # Images de production : construites et vérifiées sur chaque PR (un Dockerfile cassé se voit avant
  # la fusion), publiées sur GHCR et déployées par Dokploy seulement depuis master (deploy/README.md).
  image:
    name: Images · Build · Vérification · GHCR
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      SOURCE: https://github.com/${{ github.repository }}
      PUBLISH: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build application
        run: >-
          docker build
          --label "org.opencontainers.image.source=$SOURCE"
          --label "org.opencontainers.image.revision=$GITHUB_SHA"
          -t "$REGISTRY/coaching-life-app:sha-$GITHUB_SHA" -t "$REGISTRY/coaching-life-app:latest" .

      - name: Build sauvegarde
        run: >-
          docker build
          --label "org.opencontainers.image.source=$SOURCE"
          --label "org.opencontainers.image.revision=$GITHUB_SHA"
          -t "$REGISTRY/coaching-life-backup:sha-$GITHUB_SHA" -t "$REGISTRY/coaching-life-backup:latest" deploy/backup

      # Démarrage réel devant un Postgres jetable : migrations, seed, pages, caches, en-têtes,
      # limitation de débit par visiteur derrière le tunnel.
      - name: Vérification de l'image application
        run: ci/verify-image.sh "$REGISTRY/coaching-life-app:sha-$GITHUB_SHA"

      # Sauvegarde chiffrée puis restauration identique, devant un Postgres et un stockage S3 jetables.
      - name: Vérification de l'image de sauvegarde
        run: deploy/backup/check.sh "$REGISTRY/coaching-life-backup:sha-$GITHUB_SHA"

      # Le script de déclenchement est jugé devant un faux Dokploy : une redirection ou un refus
      # doivent échouer, jamais passer pour un déploiement.
      - name: Vérification du déclencheur Dokploy
        run: deploy/trigger-deploy.check.sh

      # Dokploy lit deploy/compose.yaml dans le dépôt : un fichier invalide ne doit pas atteindre master.
      - name: Vérification du compose
        run: deploy/compose.check.sh

      - name: Publication sur GHCR
        if: env.PUBLISH == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for image in coaching-life-app coaching-life-backup; do
            docker push --all-tags "$REGISTRY/$image"
          done

      # API Dokploy (`compose.deploy`). Sans les secrets, les images sont publiées et le déploiement
      # reste manuel. Le panneau étant derrière Cloudflare Access, le jeton de service passe par CF_ACCESS_*.
      - name: Déploiement Dokploy
        if: env.PUBLISH == 'true'
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          if [ -z "$DOKPLOY_URL" ] || [ -z "$DOKPLOY_API_KEY" ] || [ -z "$DOKPLOY_COMPOSE_ID" ]; then
            echo "::notice::Secrets DOKPLOY_URL, DOKPLOY_API_KEY ou DOKPLOY_COMPOSE_ID absents, aucun déploiement"
            exit 0
          fi
          deploy/trigger-deploy.sh

      # Sonde du site après le déploiement, si son adresse est renseignée (variable du dépôt) : elle
      # prouve que le site répond, pas que la nouvelle version a remplacé l'ancienne.
      - name: Sonde du site
        if: env.PUBLISH == 'true' && vars.DEPLOY_HEALTH_URL != ''
        env:
          DEPLOY_HEALTH_URL: ${{ vars.DEPLOY_HEALTH_URL }}
        run: |
          curl --fail --silent --show-error --max-time 10 \
            --retry 18 --retry-delay 10 --retry-all-errors "$DEPLOY_HEALTH_URL" -o /dev/null
