name: CI

on:
  push:
    branches: [master]
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test --watch=false
      - run: pnpm build
      - run: pnpm --filter @coaching-life/backend typecheck
      - run: pnpm --filter @coaching-life/backend test
      - run: pnpm --filter @coaching-life/backend build
      - run: pnpm audit --prod --audit-level high
